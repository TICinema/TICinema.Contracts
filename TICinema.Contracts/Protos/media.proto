syntax = "proto3";

package media;

// Эта строчка важна для .NET, чтобы классы легли в правильный namespace
option csharp_namespace = "TICinema.Contracts.Protos.Media";

service MediaService {
  rpc Upload(UploadRequest) returns (UploadResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
}

message UploadRequest {
  string file_name = 1;
  string folder = 2;
  string content_type = 3;
  bytes data = 4; // В Go это req.Data
}

message UploadResponse {
  string key = 1;
}

message GetRequest {
  string key = 1;
}

message GetResponse {
  bytes data = 1;
  string content_type = 2;
}

message DeleteRequest {
  string key = 1;
}

message DeleteResponse {
  bool success = 1;
}