name: Publish TCinema.Core

on:
  push:
    branches:
      - main # Скрипт сработает, когда ты сделаешь push в ветку main

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # 1. Скачиваем код из твоего репозитория
      - uses: actions/checkout@v4

      # 2. Устанавливаем окружение .NET 10
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 3. Собираем проект и создаем пакет (.nupkg)
      - name: Build and Pack
        run: dotnet pack TICinema.Core/TICinema.Core.csproj -c Release -o out

      # 4. Публикуем пакет на NuGet.org
      - name: Push to NuGet
        run: dotnet nuget push "out/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate